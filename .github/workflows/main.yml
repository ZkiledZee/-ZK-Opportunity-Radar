name: Build ZK Opportunity Radar IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project settings
        run: |
          cat > project.yml <<'PROJECT'
          name: ZKOpportunityRadar
          options:
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              CURRENT_PROJECT_VERSION: 2
              MARKETING_VERSION: 0.1.1
          targets:
            ZKOpportunityRadar:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: APP_SOURCE.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.zk.opportunityradar
                  PRODUCT_NAME: ZK Radar
                  PRODUCT_MODULE_NAME: ZKOpportunityRadar
                  EXECUTABLE_NAME: ZKOpportunityRadar
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: ZK Radar
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  TARGETED_DEVICE_FAMILY: "1"
                  SUPPORTS_MACCATALYST: NO
                  CODE_SIGN_STYLE: Automatic
              scheme:
                testTargets: []
          PROJECT
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project ZKOpportunityRadar.xcodeproj -scheme ZKOpportunityRadar -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/ZK Radar.app" Payload/
          zip -r ZK_Opportunity_Radar_v0.1.1.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZK-Opportunity-Radar-v0.1.1
          path: ZK_Opportunity_Radar_v0.1.1.ipa
          if-no-files-found: error
